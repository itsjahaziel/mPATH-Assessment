<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <nav>
      <a [class.active]="activeTab === 'users'" (click)="setActiveTab('users')"
        >User Management</a
      >
      <a [class.active]="activeTab === 'logs'" (click)="setActiveTab('logs')"
        >System Logs</a
      >
      <a class="logout" (click)="logout()">Logout</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="page-container">
      <!-- User Management Section -->
      <div *ngIf="activeTab === 'users'" class="section">
        <h2>User Management</h2>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users">
                <td>{{ user.name }}</td>
                <td>{{ user.role }}</td>
                <td>{{ user.status }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- System Logs Section -->
      <div *ngIf="activeTab === 'logs'" class="section">
        <h2>System Logs</h2>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Action</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let log of logs">
                <td>{{ log.user }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.date }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
